name: Verifiable v2 ELF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install solana-verify
        run: |
          curl -fsSL https://github.com/solana-foundation/solana-verifiable-build/releases/download/v0.5.1/solana-verify-0.5.1-linux -o solana-verify
          chmod +x solana-verify
          sudo mv solana-verify /usr/local/bin/solana-verify
          solana-verify --version

      - name: Docker verifiable build
        run: solana-verify build --library-name jrock_lotto_v2

      - uses: actions/upload-artifact@v4
        with:
          name: jrock_lotto_v2_verified
          path: target/deploy/jrock_lotto_v2.so
          if-no-files-found: error
