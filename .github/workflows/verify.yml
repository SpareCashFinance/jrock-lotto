name: Verify v2 on OtterSec

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install solana-verify
        run: |
          curl -fsSL https://github.com/solana-foundation/solana-verifiable-build/releases/download/v0.5.1/solana-verify-0.5.1-linux -o solana-verify
          chmod +x solana-verify
          sudo mv solana-verify /usr/local/bin/solana-verify
          solana-verify --version

      - name: Queue OtterSec rebuild
        run: |
          curl -fsS -X POST https://verify.osec.io/verify \
            -H "Content-Type: application/json" \
            -d '{"repository":"https://github.com/SpareCashFinance/jrock-lotto","program_id":"66FyiUTkw4JMYMi3yErfa7UBqrHm9GZha1meAxcgbjDg","commit_hash":"5513a4854dbbe80f4cea4ecee3d04b40077ca22f","lib_name":"jrock_lotto_v2"}'

      - name: Export verification PDA transaction
        run: |
          solana-verify export-pda-tx -um \
            --program-id 66FyiUTkw4JMYMi3yErfa7UBqrHm9GZha1meAxcgbjDg \
            --uploader 62C41rN2uUrsZoRkZyTqxD8GJYpa6KtERAtehfNmiXwq \
            --library-name jrock_lotto_v2 \
            --commit-hash 5513a4854dbbe80f4cea4ecee3d04b40077ca22f \
            https://github.com/SpareCashFinance/jrock-lotto \
            | tee pda-tx.txt

      - name: Submit remote job
        run: |
          solana-verify remote submit-job \
            --program-id 66FyiUTkw4JMYMi3yErfa7UBqrHm9GZha1meAxcgbjDg \
            --uploader 62C41rN2uUrsZoRkZyTqxD8GJYpa6KtERAtehfNmiXwq \
            || true

      - uses: actions/upload-artifact@v4
        with:
          name: verify-pda-tx
          path: pda-tx.txt
          if-no-files-found: warn
