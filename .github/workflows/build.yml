name: Build lotto program

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.2.2/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Build v1 SBF
        run: cargo-build-sbf --manifest-path programs/jrock_lotto/Cargo.toml

      - name: Build v2 SBF
        run: cargo-build-sbf --manifest-path programs/jrock_lotto_v2/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: jrock_lotto
          path: |
            target/deploy/jrock_lotto.so
            target/deploy/jrock_lotto_v2.so
          if-no-files-found: error
